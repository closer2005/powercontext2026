app:
  name: 离谱法庭 · The Absurd Court
  description: 在线起诉任何东西：通敌的充电线、恶意循环的周一、非法占床的猫。AI 法官包青天 2.0 开庭、被告物件成精狡辩、你补充证据自由辩论，最后法官检索《荒诞法典》并参考你的旧案底，当庭宣读一份离谱判决书——案卷永久归档在 seekdb。
  icon: ⚖️
  icon_background: '#FFEAD5'
  mode: advanced-chat
  use_icon_as_answer_icon: false
