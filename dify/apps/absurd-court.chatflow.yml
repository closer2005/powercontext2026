              m = re.search(r"#(\d{4})", text)
              if not m:
                  return {"note": ""}
              no = m.group(1)
              return {"note": "📜 本官翻了案底：此被告有旧案 #%s，本次参照旧案 #%s 从重审理。" % (no, no)}
        variables:
        - variable: precedent_text
          value_selector:
          - search_precedent
          - body
        outputs:
          note:
            type: string
            children: null
