    - id: verdict_code
      type: custom
      position:
        x: 2020
        y: 420
      positionAbsolute:
        x: 2020
        y: 420
      width: 244
      height: 98
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 解析判决 JSON
        desc: ''
        selected: false
        code_language: python3
        code: |-
          import json
          import re


          def main(llm_text: str, precedent_text: str) -> dict:
              text = (llm_text or "").strip()
              text = re.sub(r"^```(?:json)?\s*", "", text)
              text = re.sub(r"\s*```$", "", text)
              obj = {}
              start, end = text.find("{"), text.rfind("}")
              if start != -1 and end != -1 and end > start:
                  try:
                      obj = json.loads(text[start:end + 1])
                  except Exception:
                      obj = {}
              if not isinstance(obj, dict):
                  obj = {}

              verdict = str(obj.get("verdict") or "").strip()
              if verdict not in ("罪名成立", "罪名不成立"):
                  verdict = "罪名成立"
              penalty = str(obj.get("penalty") or "").strip() or "罚它为原告当庭道歉三次"
              judgment = str(obj.get("judgment") or "").strip()

              # 确定性校验：seekdb 案卷库里没有真实旧案号时，删掉模型脑补出来的"参照…判例"句子
              if not re.search(r"#\d{4}", precedent_text or ""):
                  judgment = re.sub(r"[^。；\n]*参照[^。；\n]*判例[^。；\n]*[。；]?", "", judgment).strip()

              if not judgment:
                  judgment = "本院认为，被告的行为确实离谱，但卷宗证据有限，本案责令被告当庭道歉、赔偿原告一块饼干，退庭。"
              return {
                  "verdict": verdict,
                  "penalty": penalty[:80],
                  "judgment": judgment[:400],
                  "ok": "true",
              }
        variables:
        - variable: llm_text
          value_selector:
          - verdict_llm
          - text
        - variable: precedent_text
          value_selector:
          - conversation
          - precedent
        outputs:
          verdict:
            type: string
            children: null
          penalty:
            type: string
            children: null
          judgment:
            type: string
            children: null
          ok:
            type: string
            children: null
