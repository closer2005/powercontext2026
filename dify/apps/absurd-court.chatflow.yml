              for item in (result or []):
                  if isinstance(item, dict):
                      content = item.get("content") or ""
                  else:
                      content = str(item)
                  content = str(content).strip()
                  if content:
                      parts.append(content)
              text = "\n\n".join(parts)
              if not text:
                  text = "（本院暂时没有检索到匹配的法条，请依据法庭常识宣判）"
              return {"codex": text[:800]}
